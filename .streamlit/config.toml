[theme]
primaryColor = "#0284c7"
backgroundColor = "#07090e"
secondaryBackgroundColor = "#0d1322"
textColor = "#f8fafc"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
